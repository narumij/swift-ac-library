name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, compatible/AtCoder/2025]
  pull_request:
    branches: [main, compatible/AtCoder/2025]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
      - name: Run tests
        run: swift test -c ${{ matrix.configuration }}

  sanitizers:
    name: ${{ matrix.sanitizer }} sanitizer (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
      # Leak checking is separate from address safety. Do not suppress memory
      # errors or compiler failures. Both sanitizers exclude child-process tests.
      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=0:symbolize=1:abort_on_error=1
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
          SWIFT_BACKTRACE: enable=yes
        shell: bash
        run: |
          mkdir -p sanitizer-logs
          swift --version | tee sanitizer-logs/environment.log
          uname -a | tee -a sanitizer-logs/environment.log
          set -o pipefail
          extra_args=(--skip 'DeathTests')
          if [[ "${{ matrix.sanitizer }}" == "thread" ]]; then
            extra_args+=(--traits TSAN_TEST)
          else
            extra_args+=(--traits ASAN_TEST)
          fi
          echo 'All available tests except DeathTests (child processes)' > sanitizer-logs/selected-tests.txt
          swift test -c ${{ matrix.configuration }} "${extra_args[@]}" \
            --sanitize ${{ matrix.sanitizer }} --build-system native \
            2>&1 | tee sanitizer-logs/full-console.log
          grep -Eq 'Test run with [1-9][0-9]* tests .* passed' sanitizer-logs/full-console.log
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sanitizer }}-${{ matrix.configuration }}-diagnostics
          path: sanitizer-logs
          if-no-files-found: warn

  documentation:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest
      - name: Build documentation
        shell: bash
        run: |
          mkdir -p documentation-diagnostics
          swift --version | tee documentation-diagnostics/environment.log
          set -o pipefail
          swift package -c release --allow-writing-to-directory .build/documentation \
            generate-documentation --target AtCoder \
            --output-path .build/documentation \
            --transform-for-static-hosting --hosting-base-path swift-ac-library \
            2>&1 | tee documentation-diagnostics/full-console.log
      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-diagnostics
          path: documentation-diagnostics
      # DocC symbol filenames can contain colons, which upload-artifact rejects.
      - name: Archive documentation preview
        run: tar -czf .build/AtCoder-documentation.tar.gz -C .build/documentation .
      - name: Upload documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: AtCoder-documentation
          path: .build/AtCoder-documentation.tar.gz
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/documentation

  deploy-documentation:
    name: Deploy main documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
